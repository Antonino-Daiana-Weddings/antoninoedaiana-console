<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BunkerF — Nuovo Ordine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background"></div>
  <div class="background-after"></div>

  <main>
    <div class="page-content">

      <h1>Crea Ordine</h1>

      <div class="form-card-glass">
        <div class="form-group">
          <label for="name">Nome Cliente</label>
          <input type="text" id="name" placeholder="Es. Alessio" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="product">Prodotto</label>
          <input type="text" id="product" placeholder="Es. Leone Nero" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="qty">Quantità</label>
          <input type="number" id="qty" value="1" min="1" max="99">
        </div>
        <div class="form-group">
          <label for="price">Prezzo (€)</label>
          <input type="number" id="price" value="8.00" min="0" step="0.50">
        </div>
        <div class="form-group">
          <label for="order_num">Numero Ordine</label>
          <input type="number" id="order_num" min="1">
        </div>
        <button class="btn-form" onclick="creaOrdine()">Crea Ordine</button>
      </div>

      <a href="#" class="base-button inverted outline" id="last-order-link"
         style="display:none;font-size:13px;opacity:0.75;"></a>

    </div>
  </main>

  <div id="notification" class="notification"></div>

  <script>
    var saved = JSON.parse(localStorage.getItem('lastOrder') || 'null');
    var autoNum = saved ? (parseInt(saved.orderNum) + 1) : (Math.floor(Math.random()*900)+100);
    document.getElementById('order_num').value = autoNum;

    if (saved) {
      document.getElementById('name').value    = saved.name    || '';
      document.getElementById('product').value = saved.product || '';
      document.getElementById('qty').value     = saved.qty     || 1;
      document.getElementById('price').value   = saved.price   || '8.00';
      var lastLink = document.getElementById('last-order-link');
      lastLink.href = 'order.html?' + new URLSearchParams(saved).toString();
      lastLink.textContent = 'Rivedi ordine #' + saved.orderNum;
      lastLink.style.display = 'flex';
    }

    function showNotif(msg) {
      var n = document.getElementById('notification');
      n.textContent = msg;
      n.className = 'notification show';
      setTimeout(function() { n.className = 'notification'; }, 2200);
    }

    function creaOrdine() {
      var name     = document.getElementById('name').value.trim();
      var product  = document.getElementById('product').value.trim();
      var qty      = parseInt(document.getElementById('qty').value)     || 1;
      var price    = parseFloat(document.getElementById('price').value) || 0;
      var orderNum = parseInt(document.getElementById('order_num').value) || autoNum;

      if (!name)    { showNotif('Inserisci il nome del cliente'); return; }
      if (!product) { showNotif('Inserisci il prodotto');         return; }

      var data = { name: name, product: product, qty: qty,
                   price: price.toFixed(2), orderNum: orderNum };
      localStorage.setItem('lastOrder', JSON.stringify(data));
      window.location.href = 'order.html?' + new URLSearchParams(data).toString();
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') creaOrdine();
    });
  </script>
</body>
</html>
