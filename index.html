<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BunkerF — Nuovo Ordine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background"></div>
  <div class="background-after"></div>

  <main>
    <div class="page-content">

      <div class="business-header">
        <img
          src="https://img.qromo.io/businesses/KReWJwtm7a2cEmi-full.png"
          alt="BunkerF"
          class="business-logo"
          onerror="this.style.display='none'"
        >
      </div>

      <h1 class="page-title">Crea Ordine</h1>

      <div class="order-white-content form-card-anim" style="padding: 24px;">
        <div class="form-group">
          <label for="name">Nome Cliente</label>
          <input type="text" id="name" placeholder="Es. Marco" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="product">Prodotto</label>
          <input type="text" id="product" placeholder="Es. Atomico" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="qty">Quantità</label>
          <input type="number" id="qty" value="1" min="1" max="99">
        </div>
        <div class="form-group">
          <label for="price">Prezzo (€)</label>
          <input type="number" id="price" value="8.00" min="0" step="0.50">
        </div>
        <div class="form-group">
          <label for="order_num">Numero Ordine</label>
          <input type="number" id="order_num" min="1">
        </div>

        <button class="btn btn-primary" onclick="creaOrdine()">
          Crea Ordine
        </button>
      </div>

      <a href="#" class="back-link" id="last-order-link" style="display:none; opacity:0.7; font-size:13px;">
        Rivedi ultimo ordine
      </a>

    </div>
  </main>

  <div id="notification" class="notification"></div>

  <script>
    // Auto-genera numero ordine progressivo
    const saved = JSON.parse(localStorage.getItem('lastOrder') || 'null');
    const autoNum = saved ? (parseInt(saved.orderNum) + 1) : (Math.floor(Math.random() * 900) + 100);
    document.getElementById('order_num').value = autoNum;

    // Ripristina ultimi valori (escluso numero ordine già auto-incrementato)
    if (saved) {
      document.getElementById('name').value    = saved.name    || '';
      document.getElementById('product').value = saved.product || '';
      document.getElementById('qty').value     = saved.qty     || 1;
      document.getElementById('price').value   = saved.price   || '8.00';

      const lastLink = document.getElementById('last-order-link');
      lastLink.href = 'order.html?' + new URLSearchParams(saved).toString();
      lastLink.textContent = 'Rivedi ultimo ordine (#' + saved.orderNum + ')';
      lastLink.style.display = 'block';
    }

    function showNotif(msg) {
      const n = document.getElementById('notification');
      n.textContent = msg;
      n.className = 'notification show';
      setTimeout(() => { n.className = 'notification'; }, 2200);
    }

    function creaOrdine() {
      const name     = document.getElementById('name').value.trim();
      const product  = document.getElementById('product').value.trim();
      const qty      = parseInt(document.getElementById('qty').value)    || 1;
      const price    = parseFloat(document.getElementById('price').value) || 0;
      const orderNum = parseInt(document.getElementById('order_num').value) || autoNum;

      if (!name)    { showNotif('Inserisci il nome del cliente'); return; }
      if (!product) { showNotif('Inserisci il prodotto');         return; }

      const data = {
        name,
        product,
        qty,
        price: price.toFixed(2),
        orderNum
      };

      localStorage.setItem('lastOrder', JSON.stringify(data));
      window.location.href = 'order.html?' + new URLSearchParams(data).toString();
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') creaOrdine();
    });
  </script>
</body>
</html>
